function normalizar(texto){
return texto
.toLowerCase()
.normalize("NFD")
.replace(/[\u0300-\u036f]/g,"")
.replace(/\s+/g," ")
.trim();
}

function consultar(){

const input = document.getElementById("txtNombre");
const resultado = document.getElementById("resultado");
const nombreBuscado = normalizar(input.value);

if(!nombreBuscado){
resultado.innerHTML = `<div class="error">Escribe tu nombre para consultar</div>`;
return;
}

const coincidencias = invitados.filter(x => normalizar(x.nombre) === nombreBuscado);

// Si el nombre aparece varias veces, se prefiere el registro que sí tiene mesa
const invitado = coincidencias.find(x => x.mesa) || coincidencias[0];

if(invitado){
resultado.innerHTML = `
<div class="tarjeta">
<div class="nombre">${invitado.nombre.trim()}</div>
<div class="mesa">Mesa ${invitado.mesa || "por asignar"}</div>
</div>
`;
}else{
resultado.innerHTML = `<div class="error">Invitado no encontrado</div>`;
}

input.blur(); // cierra el teclado del iPhone para que se vea el resultado
}

document.getElementById("btnConsultar").addEventListener("click", consultar);

document.getElementById("txtNombre").addEventListener("keydown", function(e){
if(e.key === "Enter"){
consultar();
}
});
